name: Release

# Tag a commit and the release builds and publishes itself:
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish
        required: true

# Needed to create the release and upload its asset. The repository's default
# workflow token is read-only, so this is granted explicitly.
permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Full history, so the generated notes can diff against the last tag.
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

      # A tag should not ship if the suite is red, even though CI already ran
      # on the commit -- the tag may point somewhere else entirely.
      - name: Unit tests
        run: |
          xcodebuild test \
            -project requester.xcodeproj \
            -scheme requester \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:requesterTests \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=""

      # MARKETING_VERSION comes from the tag, so the About box agrees with the
      # release instead of drifting from it.
      - name: Build
        run: |
          xcodebuild build \
            -project requester.xcodeproj \
            -scheme requester \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=""

      - name: Package
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent Requester.app \
            "$GITHUB_WORKSPACE/Requester-${{ steps.version.outputs.number }}.zip"

      # The caveat first, then GitHub's generated changelog appended. Composed
      # here rather than with --generate-notes so both end up in one body.
      - name: Compose notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ### Install

          This build is **not signed or notarised**. It is produced in CI without an
          Apple Developer certificate, so macOS Gatekeeper will refuse to open it
          until the quarantine flag is cleared:

          ```sh
          xattr -dr com.apple.quarantine Requester.app
          open Requester.app
          ```

          Requires macOS 26.5 or later, Apple silicon or Intel.

          ---

          NOTES
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="${{ steps.version.outputs.tag }}" \
            --jq .body >> notes.md || true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Requester ${{ steps.version.outputs.number }}" \
            --notes-file notes.md \
            "Requester-${{ steps.version.outputs.number }}.zip"
